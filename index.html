<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b0a10" />
    <title>Chronicle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; background: #0b0a10; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
      #app { position: fixed; inset: 0; overflow: hidden; }
      canvas { display: block; }
      /* Preload fonts so Phaser's canvas text picks them up on first draw. */
      .fontload { position: absolute; left: -9999px; top: -9999px; opacity: 0; }

      /* Mobile Landscape Orientation Guard */
      .orientation-guard {
        display: none;
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, #181326 0%, #0b0a10 85%);
        z-index: 999999;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #f5ecd7;
        font-family: Cinzel, 'Times New Roman', serif;
        padding: 24px;
        box-sizing: border-box;
      }
      .guard-card {
        border: 2px solid rgba(224, 182, 74, 0.45);
        background: rgba(20, 17, 28, 0.95);
        border-radius: 16px;
        padding: 28px 36px;
        max-width: 420px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(224, 182, 74, 0.1);
      }
      .guard-emblem {
        color: #e0b64a;
        font-size: 28px;
        margin-bottom: 8px;
        text-shadow: 0 0 12px rgba(224, 182, 74, 0.6);
      }
      .guard-icon {
        font-size: 42px;
        margin-bottom: 12px;
        display: inline-block;
        animation: rotatePhone 2.6s ease-in-out infinite;
      }
      @keyframes rotatePhone {
        0%, 15% { transform: rotate(0deg); }
        45%, 70% { transform: rotate(-90deg); }
        85%, 100% { transform: rotate(0deg); }
      }
      .guard-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 4px;
        color: #e0b64a;
        margin-bottom: 8px;
      }
      .guard-msg {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 19px;
        color: #f5ecd7;
        margin-bottom: 6px;
        font-style: italic;
      }
      .guard-sub {
        font-family: Inter, sans-serif;
        font-size: 12px;
        color: #b9ad91;
        letter-spacing: 1px;
      }
      @media (orientation: landscape) and (max-height: 580px) {
        .orientation-guard {
          display: flex;
        }
      }

      /* Re-enter fullscreen (shown only when fullscreen is available and not active) */
      .fs-btn {
        display: none;
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        right: calc(env(safe-area-inset-right, 0px) + 10px);
        z-index: 99999;
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: 50%;
        border: 1.5px solid rgba(224, 182, 74, 0.65);
        background: rgba(20, 17, 28, 0.85);
        color: #e0b64a;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0,0,0,0.6);
        -webkit-tap-highlight-color: transparent;
      }
      .fs-btn svg { width: 18px; height: 18px; display: block; }
      .fs-btn.visible { display: flex; }
      .fs-btn.fs-btn--left { right: auto; left: calc(env(safe-area-inset-left, 0px) + 10px); }
      .fs-btn.fs-btn--left-inner { right: auto; left: calc(env(safe-area-inset-left, 0px) + 58px); }
      .fs-btn:active { background: rgba(224, 182, 74, 0.25); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <button id="fs-btn" class="fs-btn" type="button" aria-label="Enter fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    <div id="orientation-guard" class="orientation-guard" aria-hidden="true">
      <div class="guard-card">
        <div class="guard-emblem">❖</div>
        <div class="guard-icon">↻</div>
        <div class="guard-title">CHRONICLE</div>
        <div class="guard-msg">Please rotate your device to portrait to rule.</div>
      </div>
    </div>
    <div class="fontload"><span style="font-family:Cinzel,serif;font-weight:700">C</span><span style="font-family:Cinzel,serif;font-weight:900">C</span><span style="font-family:'Cormorant Garamond',serif">C</span><span style="font-family:'Cormorant Garamond',serif;font-style:italic">C</span><span style="font-family:Inter,sans-serif">C</span><span style="font-family:Inter,sans-serif;font-weight:600">C</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
